esphome:
  name: heliospwm
  friendly_name: HeliosPWM  # device name in HA; entity IDs become <domain>.heliospwm_<name>
  # Set both PWM outputs to 50% (fans off) as early as possible, instead of leaving them at
  # 0% duty until the first run of the fan control loop. Priority 600 runs right after the
  # ledc outputs (priority 800) have been set up, before WiFi / API.
  on_boot:
    - priority: 600
      then:
        - output.set_level:
            id: fan_pwm_wz
            level: 50%
        - output.set_level:
            id: fan_pwm_sz
            level: 50%

esp32:
  board: lolin_s2_mini
  cpu_frequency: 160MHz
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Never reboot because WiFi is not available: the device must keep running (and counting
  # operating hours) on its own, operated via the hardware button. It keeps trying to reconnect.
  reboot_timeout: 0s

# Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "heliospwm"
#    password: "12345678"
#captive_portal:

web_server:
  local: true
  port: 80
  version: 3
  # Groups for the web UI (top to bottom)
  sorting_groups:
    - id: grp_speed
      name: "Fan Speed"
      sorting_weight: 10
    - id: grp_modes
      name: "Modes"
      sorting_weight: 20
    - id: grp_status
      name: "Status"
      sorting_weight: 30
    - id: grp_settings
      name: "Settings"
      sorting_weight: 40
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

ota:
  - platform: esphome
    encryption: {}  # uses the api encryption key

logger:
  level: INFO  # INFO for production use, DEBUG only for troubleshooting

api:
  id: heliospwmapi
  encryption:
    key: !secret api_encryption_key
  # Never reboot because HA is not connected: the device must keep running (and counting
  # operating hours) on its own, operated via the web UI or the hardware button.
  reboot_timeout: 0s
  # Send the operating hours accumulated while offline as soon as HA reconnects
  on_client_connected:
    - script.execute: publish_operating_hours

# Time provided by Home Assistant via the ESPHome API.
# After the first sync the ESP keeps the clock running on its own, so the time stays
# valid while the connection to HA is interrupted; it is re-synced on reconnect.
time:
  - platform: homeassistant
    id: ha_time

# Operating hours counter (RAM only, never written to flash)
# Total = base value from HA (input_number.ophours_heliospwm) + time counted since boot.
# The value is only published once the base value from HA is known, so a reboot
# can never overwrite the stored value in HA with a lower one.
script:
  - id: publish_operating_hours
    then:
      - lambda: |-
          if (!id(operating_base_known)) {
            ESP_LOGI("operating_hours", "Base value from HA not yet received - not publishing");
            return;
          }
          float hours = id(operating_base_hours) + id(operating_ms_counted) / 3600000.0;
          ESP_LOGI("operating_hours", "Operating hours: %.1f h", hours);
          id(operating_hours).publish_state(hours);

  # Single click: next fan speed from ${button_speeds}
  - id: button_next_speed
    then:
      - lambda: |-
          static const std::vector<float> speeds = {${button_speeds}};
          if (speeds.empty()) return;
          float current = id(fan_speed).state;
          // Next value in the list after the current speed; if the current speed is not
          // in the list (e.g. set from HA), the next higher value; wraps around at the end.
          size_t next = 0;
          for (size_t i = 0; i < speeds.size(); i++) {
            if (std::fabs(speeds[i] - current) < 0.5f) { next = (i + 1) % speeds.size(); break; }
            if (speeds[i] > current) { next = i; break; }
          }
          ESP_LOGI("button", "Fan speed: %.0f%% -> %.0f%%", current, speeds[next]);
          auto call = id(fan_speed).make_call();
          call.set_value(speeds[next]);
          call.perform();

  # Double click: next operating mode from ${button_modes}
  - id: button_next_mode
    then:
      - lambda: |-
          static const std::vector<std::string> modes = {${button_modes}};
          if (modes.empty()) return;
          // The current mode is compared by option index (the select has no "state" member
          // in current ESPHome versions).
          auto current_index = id(operating_mode).active_index();
          // Next mode in the list after the current one; first entry if not in the list
          size_t next = 0;
          const char *current = "?";
          for (size_t i = 0; i < modes.size(); i++) {
            auto index = id(operating_mode).index_of(modes[i]);
            if (current_index.has_value() && index.has_value() && *index == *current_index) {
              current = modes[i].c_str();
              next = (i + 1) % modes.size();
              break;
            }
          }
          const std::string &target = modes[next];
          if (!id(operating_mode).has_option(target)) {
            ESP_LOGW("button", "Unknown mode '%s' in button_modes", target.c_str());
            return;
          }
          ESP_LOGI("button", "Mode: %s -> %s", current, target.c_str());
          auto call = id(operating_mode).make_call();
          call.set_option(target);
          call.perform();

# Constants for frequently used values
substitutions:
  pwm_frequency: "3200" # Frequency in Hertz
  pendulum_delay_ms: "900"       # Pause in ms during a direction change (fan at 50%)
  # Hardware button
  button_pin: GPIO16
  # Fan speed presets (in %): used for the preset buttons (web UI / HA). The presets listed in
  # button_speeds are cycled in this order by a single click of the hardware button.
  # 0-100, matching the step of "Fan Speed" (25).
  # The button names (Off / Low / Medium / High / Ultra) are fixed, so changing a value here
  # does not change the entity IDs in HA. Keep the values in ascending order.
  speed_1: "0"    # Off
  speed_2: "25"   # Low
  speed_3: "50"   # Medium
  speed_4: "75"   # High
  speed_5: "100"  # Ultra
  button_speeds: "${speed_1}, ${speed_2}, ${speed_3}, ${speed_4}"  # Ultra is not part of the button cycle
  # Operating modes cycled by a double click, in this order.
  # Must be options of the "Operating Mode" select: "Pendulum", "Supply", "Cooking"
  button_modes: '"Pendulum", "Cooking"'

# Output configurations for PWM signals
output:
  - platform: ledc
    pin: GPIO1 # Fan WZ
    frequency: ${pwm_frequency} Hz
    id: fan_pwm_wz

  - platform: ledc
    pin: GPIO2 # Fan SZ
    frequency: ${pwm_frequency} Hz
    id: fan_pwm_sz

# Input controls for the GUI
number:
  - platform: template
    name: "Fan Speed [%]"
    id: fan_speed
    min_value: 0
    max_value: 100
    step: 25
    initial_value: 0
    restore_value: true  # keep the speed across reboots / OTA updates
    optimistic: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:fan"
    web_server:
      sorting_group_id: grp_speed
      sorting_weight: 20

  # Cap for the fan speed (e.g. night reduction set from HA): the effective speed is
  # min(Fan Speed, Upper Limit). 100 = no limit, 0 = fans off. "Fan Speed" itself is not changed.
  - platform: template
    name: "Upper Limit [%]"
    id: upper_limit
    min_value: 0
    max_value: 100
    step: 25
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:percent"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 10

  - platform: template
    name: "Pendulum Interval [s]"
    id: pendulum_interval
    min_value: 20
    max_value: 60
    step: 5
    initial_value: 45
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    device_class: duration
    mode: slider
    entity_category: config
    icon: "mdi:timer-sync-outline"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 20

  # Fan speed applied whenever Supply Mode / Cooking Mode is activated
  - platform: template
    name: "Supply Mode Speed [%]"
    id: supply_mode_speed
    min_value: 0
    max_value: 100
    step: 25
    initial_value: 50
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    icon: "mdi:home-import-outline"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 30

  - platform: template
    name: "Cooking Mode Speed [%]"
    id: cooking_mode_speed
    min_value: 0
    max_value: 100
    step: 25
    initial_value: 50
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    icon: "mdi:pot-steam"
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 40

# Operating mode - exactly one of the options is active at any time.
#   Pendulum: one fan supply air, one exhaust air, direction swapped every "Pendulum Interval"
#   Supply:   both fans supply air (e.g. while bathroom fan / cooker hood extract air)
#   Cooking:  SZ supply air, WZ exhaust air
# Selecting Supply or Cooking also sets "Fan Speed" to the configured mode speed
# (not applied on boot/restore, and the speed is not restored when leaving the mode).
select:
  - platform: template
    name: "Operating Mode"
    id: operating_mode
    options:
      - "Pendulum"
      - "Supply"
      - "Cooking"
    initial_option: "Pendulum"
    restore_value: true
    optimistic: true
    icon: "mdi:fan-auto"
    web_server:
      sorting_group_id: grp_modes
      sorting_weight: 10
    set_action:
      - lambda: |-
          float v = NAN;
          if (x == "Supply")  v = id(supply_mode_speed).state;
          if (x == "Cooking") v = id(cooking_mode_speed).state;
          if (std::isnan(v)) return;  // Pendulum, or mode speed not available
          auto call = id(fan_speed).make_call();
          call.set_value(v);
          call.perform();

# Sensors for current fan speeds (values are published by the fan control loop,
# the delta filter forwards them to HA only when they change)
sensor:
  - platform: template
    name: "WZ Speed"
    id: fan_wz_speed_sensor
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    update_interval: never
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 20
    filters:
      - delta: 1

  - platform: template
    name: "SZ Speed"
    id: fan_sz_speed_sensor
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    update_interval: never
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 40
    filters:
      - delta: 1

  # Operating hours since the last maintenance reset, counted on the ESP.
  # Published on HA (re)connect, when the base value from HA arrives and once per hour.
  - platform: template
    name: "Operating Hours"
    id: operating_hours
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    icon: "mdi:timer-cog-outline"
    accuracy_decimals: 1
    update_interval: never
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 50

  # Last operating hours value stored in HA. Read once after boot as base value.
  - platform: homeassistant
    id: ha_stored_operating_hours
    entity_id: input_number.ophours_heliospwm
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(operating_base_known) || std::isnan(x)) return;
            id(operating_base_hours) = x;
            id(operating_base_known) = true;
            ESP_LOGI("operating_hours", "Base value from HA: %.1f h (+ %.1f h counted since boot)",
                     x, id(operating_ms_counted) / 3600000.0);
        - script.execute: publish_operating_hours

# Fan speed preset buttons (web UI / HA) and reset of the operating hours
button:
  - platform: template
    name: "Off"
    id: fan_preset_1
    icon: "mdi:fan-off"
    on_press:
      - number.set:
          id: fan_speed
          value: ${speed_1}
    web_server:
      sorting_group_id: grp_speed
      sorting_weight: 11

  - platform: template
    name: "Low"
    id: fan_preset_2
    icon: "mdi:fan-speed-1"
    on_press:
      - number.set:
          id: fan_speed
          value: ${speed_2}
    web_server:
      sorting_group_id: grp_speed
      sorting_weight: 12

  - platform: template
    name: "Medium"
    id: fan_preset_3
    icon: "mdi:fan-speed-2"
    on_press:
      - number.set:
          id: fan_speed
          value: ${speed_3}
    web_server:
      sorting_group_id: grp_speed
      sorting_weight: 13

  - platform: template
    name: "High"
    id: fan_preset_4
    icon: "mdi:fan-speed-3"
    on_press:
      - number.set:
          id: fan_speed
          value: ${speed_4}
    web_server:
      sorting_group_id: grp_speed
      sorting_weight: 14

  - platform: template
    name: "Ultra"
    id: fan_preset_5
    icon: "mdi:fan-plus"
    on_press:
      - number.set:
          id: fan_speed
          value: ${speed_5}
    web_server:
      sorting_group_id: grp_speed
      sorting_weight: 15

  - platform: template
    name: "Reset Operating Hours"
    id: reset_operating_hours
    icon: "mdi:restore"
    entity_category: config
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 90
    on_press:
      - lambda: |-
          id(operating_base_hours) = 0.0;
          id(operating_ms_counted) = 0;
          id(operating_base_known) = true;
          ESP_LOGI("operating_hours", "Operating hours reset");
      - script.execute: publish_operating_hours

# Hardware button (to GND, external pull-up resistor)
#  - single click: cycle fan speed (button_speeds)
#  - double click: cycle operating mode (button_modes)
binary_sensor:
  - platform: gpio
    name: "Hardware Button"
    id: hw_button
    internal: true
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: false  # external pull-up on the Mini-Base
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_multi_click:
      # Double click (must be listed before the single click)
      - timing:
          - ON for at most 1s
          - OFF for at most 0.4s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - script.execute: button_next_mode
      # Single click
      - timing:
          - ON for at most 1s
          - OFF for at least 0.4s
        then:
          - script.execute: button_next_speed

# Text sensors for fan mode (published by the fan control loop only on change)
text_sensor:
  - platform: template
    name: "WZ Mode"
    id: fan_wz_mode_sensor
    icon: "mdi:fan-direction-up"
    update_interval: never
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 10

  - platform: template
    name: "SZ Mode"
    id: fan_sz_mode_sensor
    icon: "mdi:fan-direction-down"
    update_interval: never
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 30

# Globals for persistent state variables
globals:
  - id: reverse_state
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_swap_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Last fan speeds
  - id: last_fan_wz_speed
    type: float
    restore_value: false
    initial_value: '50.0'
  - id: last_fan_sz_speed
    type: float
    restore_value: false
    initial_value: '50.0'
  # Helper variables for the direction change state of each fan
  - id: fan_wz_direction_change_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: fan_sz_direction_change_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Operating hours counter (RAM only, lost on reboot / OTA / power loss)
  # Base value received from HA after boot (hours)
  - id: operating_base_hours
    type: double
    restore_value: false
    initial_value: '0.0'
  # true as soon as the base value from HA has been received (or after a reset)
  - id: operating_base_known
    type: bool
    restore_value: false
    initial_value: 'false'
  # Running time counted since boot / reset in ms
  - id: operating_ms_counted
    type: uint64_t
    restore_value: false
    initial_value: '0'
  # Set by the fan control: at least one fan is set to run
  - id: fans_running
    type: bool
    restore_value: false
    initial_value: 'false'
  # HA time (epoch seconds) and millis() of the last counting tick
  - id: operating_last_epoch
    type: int64_t
    restore_value: false
    initial_value: '0'
  - id: operating_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Hour (HA time) of the last report, -1 = not yet known
  - id: operating_last_report_hour
    type: int
    restore_value: false
    initial_value: '-1'
  # millis() of the last report (fallback while HA time is not available)
  - id: operating_last_report_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

# Fan speed automation
# PWM logic: 50% = off, > 50% = supply air, < 50% = exhaust air
# Limited to min 4% and max 96% (ebmpapst fans)
interval:
  - interval: 1s
    then:
      - lambda: |-
          float speed = id(fan_speed).state;
          float limit = id(upper_limit).state;
          // Operating mode: 0 = Pendulum, 1 = Supply, 2 = Cooking (index of the select options)
          size_t mode = id(operating_mode).active_index().value_or(0);
          bool supply = (mode == 1);
          bool cooking = (mode == 2);
          bool &reverse = id(reverse_state);
          uint32_t now = millis();
          uint32_t &last_swap = id(last_swap_time);
          const float neutral = 50.0f;
          const float min_speed = 4.0f;
          const float max_speed = 96.0f;

          // Pendulum mode: swap direction every interval
          if (!supply && !cooking) {
            uint32_t interval_ms = (uint32_t) (id(pendulum_interval).state * 1000.0f);
            if (now - last_swap >= interval_ms) {
              reverse = !reverse;
              last_swap = now;
              ESP_LOGD("pendulum_mode", "Pendulum Mode switched, new reverse state: %s", reverse ? "ON" : "OFF");
            }
          }

          // Effective speed, capped by the upper limit (100 = no limit)
          float effective_speed = std::min(speed, limit);
          float delta = 0.5f * effective_speed;

          // Direction per fan: +1 = supply air, -1 = exhaust air
          float dir_wz, dir_sz;
          if (cooking) {
            // Cooking Mode: SZ blows in supply air, WZ draws out exhaust air
            dir_wz = -1.0f;
            dir_sz = 1.0f;
          } else if (supply) {
            // Supply Mode: both fans blow air in (e.g. while bathroom fan / cooker hood extract air)
            dir_wz = 1.0f;
            dir_sz = 1.0f;
          } else {
            // Pendulum: one fan supply air, one exhaust air, swapped every interval
            dir_wz = reverse ? -1.0f : 1.0f;
            dir_sz = reverse ? 1.0f : -1.0f;
          }

          float fan_wz_speed = std::max(min_speed, std::min(max_speed, neutral + dir_wz * delta));
          float fan_sz_speed = std::max(min_speed, std::min(max_speed, neutral + dir_sz * delta));

          // Detect direction changes for each fan
          if ((id(last_fan_wz_speed) < neutral && fan_wz_speed > neutral) ||
              (id(last_fan_wz_speed) > neutral && fan_wz_speed < neutral)) {
              id(fan_wz_direction_change_time) = now;
              ESP_LOGD("fan_control", "Fan WZ direction change detected - setting to 50%% for ${pendulum_delay_ms} ms");
          }
          if ((id(last_fan_sz_speed) < neutral && fan_sz_speed > neutral) ||
              (id(last_fan_sz_speed) > neutral && fan_sz_speed < neutral)) {
              id(fan_sz_direction_change_time) = now;
              ESP_LOGD("fan_control", "Fan SZ direction change detected - setting to 50%% for ${pendulum_delay_ms} ms");
          }

          // Check whether a fan is still pausing after a direction change
          bool fan_wz_in_transition = (now - id(fan_wz_direction_change_time) < ${pendulum_delay_ms});
          bool fan_sz_in_transition = (now - id(fan_sz_direction_change_time) < ${pendulum_delay_ms});

          // Displayed / output speeds (50% during direction change)
          float display_fan_wz_speed = fan_wz_in_transition ? neutral : fan_wz_speed;
          float display_fan_sz_speed = fan_sz_in_transition ? neutral : fan_sz_speed;

          id(fan_pwm_wz).set_level(display_fan_wz_speed / 100.0f);
          id(fan_pwm_sz).set_level(display_fan_sz_speed / 100.0f);

          // Always store the last speeds
          id(last_fan_wz_speed) = fan_wz_speed;
          id(last_fan_sz_speed) = fan_sz_speed;

          // Update sensor values
          id(fan_wz_speed_sensor).publish_state(display_fan_wz_speed);
          id(fan_sz_speed_sensor).publish_state(display_fan_sz_speed);

          // Operating hours: at least one fan is set to run.
          // Uses the target speeds, so the 50% pause during a direction change
          // in pendulum mode does not interrupt the counting.
          id(fans_running) = (fan_wz_speed != neutral || fan_sz_speed != neutral);

          // Determine mode based on the displayed speeds
          auto mode_text = [&](float s, bool in_transition) -> std::string {
            if (s < neutral) return "Exhaust";
            if (s > neutral) return "Supply";
            return in_transition ? "Direction Change" : "Off";
          };

          std::string wz_mode = mode_text(display_fan_wz_speed, fan_wz_in_transition);
          std::string sz_mode = mode_text(display_fan_sz_speed, fan_sz_in_transition);
          if (!id(fan_wz_mode_sensor).has_state() || id(fan_wz_mode_sensor).state != wz_mode)
            id(fan_wz_mode_sensor).publish_state(wz_mode);
          if (!id(fan_sz_mode_sensor).has_state() || id(fan_sz_mode_sensor).state != sz_mode)
            id(fan_sz_mode_sensor).publish_state(sz_mode);

  # Operating hours counter, independent of the connection to HA.
  # - Elapsed time is taken from the HA time (ha_time). If HA is not available at boot
  #   (no time sync yet), or if the clock jumps (e.g. correction on re-sync),
  #   millis() is used for that tick.
  # - At every full hour (HA time) the value is reported to HA if connected.
  #   Without valid HA time this happens every 60 min (millis()).
  # - If HA is not connected, counting continues and the value is sent on reconnect.
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          uint32_t now_ms = millis();
          int64_t &last_epoch = id(operating_last_epoch);
          uint32_t &last_ms = id(operating_last_ms);

          // Elapsed time since the last tick
          uint32_t elapsed_ms = now_ms - last_ms;
          if (t.is_valid() && last_epoch != 0) {
            int64_t d = (int64_t) t.timestamp - last_epoch;
            if (d >= 0 && d <= 10) {
              elapsed_ms = (uint32_t) (d * 1000);
            }
          }
          if (last_ms != 0 && id(fans_running)) {
            id(operating_ms_counted) += elapsed_ms;
          }
          last_ms = now_ms;
          last_epoch = t.is_valid() ? (int64_t) t.timestamp : 0;

          // Hourly report
          bool report = false;
          if (t.is_valid()) {
            int &last_hour = id(operating_last_report_hour);
            if (last_hour < 0) {
              last_hour = t.hour;
            } else if (t.hour != last_hour) {
              last_hour = t.hour;
              report = true;
            }
          } else if (now_ms - id(operating_last_report_ms) >= 3600000UL) {
            report = true;
          }
          if (!report) return;

          id(operating_last_report_ms) = now_ms;
          // true only for a Home Assistant connection, not for the ESPHome dashboard log viewer
          if (id(heliospwmapi).is_connected_with_state_subscription()) {
            id(publish_operating_hours).execute();
          }
