# The operating hours are counted on the ESP (sensor.heliospwm_operating_hours, RAM only).
# HA keeps the last value in input_number.ophours_heliospwm; the ESP reads it after boot
# as base value. Reset via the ESP button (button.heliospwm_reset_operating_hours).

input_number:
  maint_heliospwm_threshold_months:
    name: Maint HeliosPWM Threshold (months)
    min: 1
    max: 12
    step: 3
    icon: mdi:calendar-alert
    initial: 3
    mode: slider
  # No "initial:" on purpose, so HA restores the last value after a restart
  ophours_heliospwm:
    name: OpHours HeliosPWM Stored
    min: 0
    max: 1000000
    step: 0.001
    unit_of_measurement: "h"
    icon: mdi:timer-cog-outline
    mode: box

input_datetime:
  maint_heliospwm_last_reset:
    name: Maint HeliosPWM Last Reset
    has_date: true
    has_time: true
